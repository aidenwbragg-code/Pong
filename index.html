<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="scoreboard">
            <div class="score-item">
                <h2>Player</h2>
                <div id="playerScore" class="score">0</div>
            </div>
            <div class="score-item">
                <h2>Computer</h2>
                <div id="computerScore" class="score">0</div>
            </div>
        </div>

        <div class="game-info">
            <p>Use <strong>Mouse Y</strong> or <strong>Arrow Keys (↑↓)</strong> to control left paddle</p>
            <p id="gameStatus" class="status">Press SPACE to start</p>
        </div>

        <canvas id="pongCanvas" width="800" height="400"></canvas>

        <div class="instructions">
            <p>Mouse or Arrow Keys: Control paddle | SPACE: Start/Pause</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
